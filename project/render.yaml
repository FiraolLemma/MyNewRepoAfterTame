services:
  - type: web
    name: poultry-website
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT project.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poultry_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: 4
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: doixo5oiw
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.9.13

databases:
  - name: poultry_db
    plan: free
